<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Darker Traditional Royal/Cobalt Blue Gradient (Frame & Camera Body) -->
    <linearGradient id="imgDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1e4263" stop-opacity="0.62"/>
    </linearGradient>

    <!-- Deeper Indigo-Blue Gradient (Mountains & Aperture Inner Ring) -->
    <linearGradient id="imgDeepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b6496" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#15314b" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Cyan-Blue Glow Accent (Lens Glass & Video Play Emblem) -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.68"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.38"/>
    </radialGradient>

    <!-- Unassuming Matte Yoga Pad Surface Gradient -->
    <linearGradient id="yogaMatTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22436d" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#152943" stop-opacity="0.50"/>
    </linearGradient>

    <!-- Yoga Pad Rolled End Gradient -->
    <linearGradient id="yogaRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d578b" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#13253d" stop-opacity="0.58"/>
    </linearGradient>
  </defs>

  <!-- Unassuming Yoga Pad / Mat in Perspective -->
  <g transform="translate(26, 62) scale(1.28)">
    <!-- Subtle floor shadow beneath the yoga pad -->
    <path d="M 48 258 L 288 258 L 328 214 L 92 214 Z"
          fill="#060c17" fill-opacity="0.45"/>

    <!-- Yoga Pad Thickness / Bottom Edge -->
    <path d="M 44 248 L 282 248 L 322 204 L 322 211 L 282 255 L 44 255 Z"
          fill="#1b3556" fill-opacity="0.65"
          stroke="#387eb8" stroke-width="1.2" stroke-opacity="0.55" stroke-linejoin="round"/>

    <!-- Yoga Pad Main Flat Surface -->
    <path d="M 44 248 L 282 248 L 322 204 L 88 204 Z"
          fill="url(#yogaMatTop)"
          stroke="#387eb8" stroke-width="1.5" stroke-opacity="0.60" stroke-linejoin="round"/>

    <!-- Subtle Non-Slip Texture Lines & Center Alignment Line on the Yoga Pad -->
    <line x1="70" y1="226" x2="298" y2="226"
          stroke="#5ba4e5" stroke-width="1.1" stroke-opacity="0.38" stroke-dasharray="6,5"/>
    <line x1="176" y1="207" x2="152" y2="245"
          stroke="#5ba4e5" stroke-width="1.0" stroke-opacity="0.32"/>

    <!-- Rolled-Up End of the Yoga Pad (Left Side Cylinder) -->
    <path d="M 38 236 C 34 236 31 240 31 245 C 31 250 34 254 38 254 L 82 208 C 78 208 75 204 75 199 C 75 194 78 190 82 190 Z"
          fill="url(#yogaRoll)"
          stroke="#387eb8" stroke-width="1.3" stroke-opacity="0.62"/>

    <!-- Yoga Pad Roll Spiral End-Cap -->
    <ellipse cx="40" cy="245" rx="7.5" ry="9.5"
             fill="#152943" fill-opacity="0.72"
             stroke="#4b91d1" stroke-width="1.3" stroke-opacity="0.65"/>
    <path d="M 40 241 C 42 241 43 243 43 245 C 43 247 41 249 39 249 C 37 249 36 246 37 244"
          fill="none" stroke="#63b3ed" stroke-width="1.1" stroke-opacity="0.60" stroke-linecap="round"/>

    <!-- Soft Contact Shadow Where the Picture/Cinema Frame & Lens Rest on the Yoga Pad -->
    <ellipse cx="184" cy="226" rx="74" ry="13"
             fill="#07111f" fill-opacity="0.58"/>
  </g>

  <!-- Translucent Darker-Blue Cinema/Picture Frame & Video Play Aperture Sitting on the Yoga Pad -->
  <g transform="translate(114, 92) scale(1.42)">
    <!-- Outer Framed Picture & Video Canvas -->
    <rect x="16" y="18" width="164" height="122" rx="12"
          fill="url(#imgDarkBlue)"
          stroke="#63b3ed" stroke-width="1.8" stroke-opacity="0.72"/>

    <!-- Subtle Cinema Film Sprocket Accents Along Left & Right Frame Edges -->
    <rect x="20" y="32" width="4" height="7" rx="1" fill="#7dd3fc" fill-opacity="0.45"/>
    <rect x="20" y="48" width="4" height="7" rx="1" fill="#7dd3fc" fill-opacity="0.45"/>
    <rect x="20" y="64" width="4" height="7" rx="1" fill="#7dd3fc" fill-opacity="0.45"/>
    <rect x="20" y="80" width="4" height="7" rx="1" fill="#7dd3fc" fill-opacity="0.45"/>
    <rect x="20" y="96" width="4" height="7" rx="1" fill="#7dd3fc" fill-opacity="0.45"/>
    <rect x="20" y="112" width="4" height="7" rx="1" fill="#7dd3fc" fill-opacity="0.45"/>

    <!-- Inner Matte Picture Border -->
    <rect x="28" y="28" width="142" height="102" rx="6"
          fill="#0a1222" fill-opacity="0.45"
          stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.48"/>

    <!-- Sun / Moon Disc inside Landscape -->
    <circle cx="58" cy="54" r="13"
            fill="#7dd3fc" fill-opacity="0.62"
            stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.75"/>

    <!-- Mountain Peaks inside Picture Canvas -->
    <path d="M 30 128 L 72 68 L 114 114 L 140 84 L 168 128 Z"
          fill="url(#imgDeepBlue)"
          stroke="#7dd3fc" stroke-width="1.3" stroke-opacity="0.65" stroke-linejoin="round"/>

    <!-- Foreground Camera Aperture + Video Play Prism Resting on Lower-Right of the Pad -->
    <g transform="translate(112, 76)">
      <circle cx="44" cy="44" r="40"
              fill="url(#imgDarkBlue)"
              stroke="#7dd3fc" stroke-width="1.8" stroke-opacity="0.78"/>
      <circle cx="44" cy="44" r="30"
              fill="url(#lensGlow)"
              stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.72"/>
      <!-- Aperture Blades -->
      <line x1="44" y1="14" x2="58" y2="34" stroke="#bae6fd" stroke-width="1.1" stroke-opacity="0.52"/>
      <line x1="74" y1="44" x2="54" y2="58" stroke="#bae6fd" stroke-width="1.1" stroke-opacity="0.52"/>
      <line x1="44" y1="74" x2="30" y2="54" stroke="#bae6fd" stroke-width="1.1" stroke-opacity="0.52"/>
      <line x1="14" y1="44" x2="34" y2="30" stroke="#bae6fd" stroke-width="1.1" stroke-opacity="0.52"/>
      <!-- Video Play Triangle inside the Aperture Center -->
      <polygon points="37,31 37,57 58,44"
               fill="#bae6fd" fill-opacity="0.78"
               stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.82" stroke-linejoin="round"/>
      <!-- Lens Glint -->
      <circle cx="31" cy="29" r="3.8" fill="#e0f2fe" fill-opacity="0.72"/>
    </g>
  </g>
</svg>
