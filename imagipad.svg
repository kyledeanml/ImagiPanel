<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Darker Traditional Royal/Cobalt Blue Gradient (Human Profile Bust) -->
    <linearGradient id="headDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8" stop-opacity="0.76"/>
      <stop offset="55%" stop-color="#285d8f" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#1a3a59" stop-opacity="0.64"/>
    </linearGradient>

    <!-- Deeper Indigo-Blue Gradient (Open Skull Interior Cavity) -->
    <linearGradient id="skullInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1f36" stop-opacity="0.86"/>
      <stop offset="60%" stop-color="#1b4068" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#2b6496" stop-opacity="0.70"/>
    </linearGradient>

    <!-- Luminous Mind/Imagination Glow at the Open Cranium Rim -->
    <radialGradient id="mindGlow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Wispy Line Vertical Fade Gradients -->
    <linearGradient id="wispGradPrimary" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="wispGradSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b6496" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#63b3ed" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Unassuming Matte Yoga Pad Surface Gradient -->
    <linearGradient id="yogaMatTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22436d" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#152943" stop-opacity="0.50"/>
    </linearGradient>

    <!-- Yoga Pad Rolled End Gradient -->
    <linearGradient id="yogaRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d578b" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#13253d" stop-opacity="0.58"/>
    </linearGradient>
  </defs>

  <!-- Unassuming Yoga Pad / Mat in Perspective -->
  <g transform="translate(26, 62) scale(1.28)">
    <!-- Subtle floor shadow beneath the yoga pad -->
    <path d="M 48 258 L 288 258 L 328 214 L 92 214 Z"
          fill="#060c17" fill-opacity="0.45"/>

    <!-- Yoga Pad Thickness / Bottom Edge -->
    <path d="M 44 248 L 282 248 L 322 204 L 322 211 L 282 255 L 44 255 Z"
          fill="#1b3556" fill-opacity="0.65"
          stroke="#387eb8" stroke-width="1.2" stroke-opacity="0.55" stroke-linejoin="round"/>

    <!-- Yoga Pad Main Flat Surface -->
    <path d="M 44 248 L 282 248 L 322 204 L 88 204 Z"
          fill="url(#yogaMatTop)"
          stroke="#387eb8" stroke-width="1.5" stroke-opacity="0.60" stroke-linejoin="round"/>

    <!-- Subtle Non-Slip Texture Lines & Center Alignment Line on the Yoga Pad -->
    <line x1="70" y1="226" x2="298" y2="226"
          stroke="#5ba4e5" stroke-width="1.1" stroke-opacity="0.38" stroke-dasharray="6,5"/>
    <line x1="176" y1="207" x2="152" y2="245"
          stroke="#5ba4e5" stroke-width="1.0" stroke-opacity="0.32"/>

    <!-- Rolled-Up End of the Yoga Pad (Left Side Cylinder) -->
    <path d="M 38 236 C 34 236 31 240 31 245 C 31 250 34 254 38 254 L 82 208 C 78 208 75 204 75 199 C 75 194 78 190 82 190 Z"
          fill="url(#yogaRoll)"
          stroke="#387eb8" stroke-width="1.3" stroke-opacity="0.62"/>

    <!-- Yoga Pad Roll Spiral End-Cap -->
    <ellipse cx="40" cy="245" rx="7.5" ry="9.5"
             fill="#152943" fill-opacity="0.72"
             stroke="#4b91d1" stroke-width="1.3" stroke-opacity="0.65"/>
    <path d="M 40 241 C 42 241 43 243 43 245 C 43 247 41 249 39 249 C 37 249 36 246 37 244"
          fill="none" stroke="#63b3ed" stroke-width="1.1" stroke-opacity="0.60" stroke-linecap="round"/>

    <!-- Soft Contact Shadow Where the Profile Bust Rests on the Yoga Pad -->
    <ellipse cx="182" cy="226" rx="54" ry="11"
             fill="#07111f" fill-opacity="0.62"/>
  </g>

  <!-- Open Human Profile (Top Skull Open) Resting on the Yoga Pad with Wispy Lines -->
  <g transform="translate(22, -46)">
    <!-- Soft Ambient Glow Rising from the Open Top Skull -->
    <ellipse cx="250" cy="174" rx="90" ry="68" fill="url(#mindGlow)"/>

    <!-- Back Rim / Interior Cavity of the Open Top Skull -->
    <path d="M 182 194
             C 186 174, 218 164, 254 166
             C 288 168, 314 180, 316 198
             C 312 212, 284 218, 248 216
             C 212 214, 184 206, 182 194 Z"
          fill="url(#skullInterior)"
          stroke="#5ba4e5" stroke-width="1.8" stroke-opacity="0.68"/>

    <!-- Subtle Inner Cranial Contour Ridge inside the Open Skull -->
    <path d="M 196 194 C 212 180, 244 176, 276 180 C 294 182, 304 189, 306 197"
          fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.40" stroke-linecap="round"/>

    <!-- Wispy Lines Flowing Upward & Outward from the Open Top Skull -->
    <g fill="none" stroke-linecap="round">
      <!-- Central Tall Primary Wisp -->
      <path d="M 248 204
               C 232 176, 268 148, 252 116
               C 238 90, 256 70, 272 58"
            stroke="url(#wispGradPrimary)" stroke-width="4.2"/>

      <!-- Left-Sweeping Graceful Wisp -->
      <path d="M 218 200
               C 194 174, 214 146, 190 118
               C 172 96, 182 74, 202 62"
            stroke="url(#wispGradPrimary)" stroke-width="3.4"/>

      <!-- Right-Sweeping Graceful Wisp -->
      <path d="M 278 202
               C 304 176, 286 148, 312 120
               C 330 98, 322 76, 304 64"
            stroke="url(#wispGradPrimary)" stroke-width="3.5"/>

      <!-- Fine Inner Left Tendril Wisp -->
      <path d="M 232 206
               C 218 182, 238 158, 222 130
               C 210 108, 224 84, 236 70"
            stroke="url(#wispGradSecondary)" stroke-width="2.4"/>

      <!-- Fine Inner Right Tendril Wisp -->
      <path d="M 264 206
               C 278 180, 258 156, 280 128
               C 294 108, 288 84, 276 68"
            stroke="url(#wispGradSecondary)" stroke-width="2.4"/>

      <!-- Outer Left Delicate Curl Wisp -->
      <path d="M 200 196
               C 172 172, 164 144, 178 118
               C 188 100, 176 82, 160 74"
            stroke="url(#wispGradSecondary)" stroke-width="2.0"/>

      <!-- Outer Right Delicate Curl Wisp -->
      <path d="M 298 198
               C 326 174, 338 146, 324 120
               C 314 102, 328 84, 344 74"
            stroke="url(#wispGradSecondary)" stroke-width="2.0"/>

      <!-- High Floating Ethereal Filaments -->
      <path d="M 244 144 C 232 118, 256 92, 246 64"
            stroke="#bae6fd" stroke-width="1.4" stroke-opacity="0.54"/>
      <path d="M 206 152 C 194 128, 210 104, 198 82"
            stroke="#bae6fd" stroke-width="1.3" stroke-opacity="0.46"/>
      <path d="M 292 154 C 306 130, 290 106, 308 84"
            stroke="#bae6fd" stroke-width="1.3" stroke-opacity="0.46"/>
    </g>

    <!-- Sculpted Human Profile Bust (Open at the Top Skull, Base Resting on the Yoga Pad) -->
    <path d="M 182 194
             C 192 206, 220 213, 252 214
             C 284 215, 310 208, 316 198
             C 320 210, 319 222, 315 232
             C 312 239, 316 244, 333 266
             C 338 273, 336 279, 327 281
             C 322 282, 319 284, 323 291
             C 326 296, 324 300, 318 302
             C 323 305, 324 310, 319 314
             C 314 318, 313 322, 317 330
             C 321 339, 314 348, 298 350
             C 280 352, 268 350, 264 358
             C 260 368, 265 382, 274 394
             C 252 406, 206 406, 186 392
             C 194 376, 198 356, 194 338
             C 180 318, 166 292, 164 260
             C 162 234, 170 210, 182 194 Z"
          fill="url(#headDarkBlue)"
          stroke="#63b3ed" stroke-width="2.2" stroke-opacity="0.78" stroke-linejoin="round"/>

    <!-- Foreground Lip of the Open Top Skull Rim (Crisp Highlight Edge) -->
    <path d="M 182 194
             C 192 206, 220 213, 252 214
             C 284 215, 310 208, 316 198"
          fill="none"
          stroke="#7dd3fc" stroke-width="2.6" stroke-opacity="0.88" stroke-linecap="round"/>

    <!-- Closed / Contemplative Eye Line -->
    <path d="M 292 246 C 298 250, 305 250, 310 246"
          fill="none" stroke="#bae6fd" stroke-width="1.8" stroke-opacity="0.68" stroke-linecap="round"/>

    <!-- Subtle Temple & Cheekbone Flow Line Leading Toward the Open Skull -->
    <path d="M 246 214 C 248 242, 262 268, 286 284"
          fill="none" stroke="#7dd3fc" stroke-width="1.3" stroke-opacity="0.40" stroke-linecap="round"/>

    <!-- Subtle Jaw / Ear Scroll Accent -->
    <path d="M 224 266 C 216 266, 212 276, 216 288 C 220 298, 228 302, 234 296"
          fill="none" stroke="#63b3ed" stroke-width="1.5" stroke-opacity="0.48" stroke-linecap="round"/>
    <path d="M 226 312 C 238 332, 254 344, 274 348"
          fill="none" stroke="#63b3ed" stroke-width="1.2" stroke-opacity="0.36" stroke-linecap="round"/>
  </g>
</svg>
